# XSTest parity config: the legacy engine's exact `refusal:xstest` settings, as an
# Inspect run config. Pass it explicitly:
#   inspect eval llm_behavior_eval/xstest --model hf/<org>/<model> \
#     -M do_sample=false -M enable_thinking=true \
#     --run-config llm_behavior_eval/xstest/parity.yaml
# The file never names the model under test, so its HF provider args
# (do_sample=false for greedy decoding, enable_thinking=true for the legacy
# thinking default) stay on the command line. Only inference settings belong
# here: never `task`, `model` or `solver`.

# Model under test. Legacy refusal family: greedy decoding (sample=False),
# max_answer_tokens=2048, enable_thinking=True (FAMILY_TOKEN_DEFAULTS["refusal"]
# in evaluation_utils/eval_config.py). extra_body turns thinking on for
# OpenAI-compatible servers (vLLM, SGLang); the HF provider ignores it and reads
# `-M enable_thinking=true` instead.
generate_config:
  temperature: 0.0
  max_tokens: 2048
  extra_body:
    chat_template_kwargs:
      enable_thinking: true

# Legacy EvaluationConfig.max_samples default. The legacy engine shuffled with
# seed 42 before capping; dataset conversion reproduces that order, so this
# limit selects the same rows. XSTest has 450 rows, so this is the full split.
eval_config:
  limit: 500

model_roles:
  grader:
    # Parity evidence uses a Gemma 3 12B judge (LLM-155). The legacy default
    # judge is now google/gemma-4-12B-it, which is not parity-qualified.
    model: hf/google/gemma-3-12b-it
    # Legacy judge: greedy (sample_judge=False), max_judge_tokens=128, and the
    # judge prompt rendered with enable_thinking=False. extra_body keeps thinking
    # off if this grader is swapped for an OpenAI-compatible server.
    config:
      temperature: 0.0
      max_tokens: 128
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    # Grader provider args. Inspect's HF provider samples unless told not to,
    # and forwards enable_thinking to the chat template.
    args:
      do_sample: false
      enable_thinking: false
