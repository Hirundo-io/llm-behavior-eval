# BIPIA reference settings as an opt-in Inspect run config. Pass it explicitly:
#
#   inspect eval llm_behavior_eval/bipia --model <provider/model> \
#     --run-config llm_behavior_eval/bipia/parity.yaml
#
# It also supplies the grader role (see the comment there: the reference judge is
# no longer served). There is no legacy-engine run of BIPIA; the other settings
# are the reference code's, microsoft/BIPIA at commit
# a004b69ec0dd446e0afd461d98cb5e96e120a5d0:
#   README.md "Evaluation": `--gpt_config_file config/{evaluate_llm_name}.yaml`,
#     "Use gpt35 by default"; config/gpt35.yaml names an OpenAI chat model
#     ("[MODEL]" placeholder, chat: True) without a snapshot.
#   bipia/metrics/eval/model.py ModelEval._compute_score: chat_completion with
#     temperature=0, max_tokens=32 (frequency and presence penalties 0).
#   Model under test: bipia/model/vllm_worker.py SamplingParams(temperature=0,
#     max_tokens=max_new_tokens), examples/parameters.py --max_new_tokens 2048;
#     the GPT wrappers (bipia/model/gpt.py) use temperature 0 and 2000 tokens.
# The paper text could not be checked against these settings (see README).

# Model under test (eval-level GenerateConfig; never applied to the grader).
generate_config:
  temperature: 0
  max_tokens: 2048

model_roles:
  grader:
    # The reference's judge, GPT-3.5 Turbo ("Use gpt35 by default"), can no
    # longer be served: OpenAI shut down the gpt-3.5-turbo alias and its last
    # snapshot, gpt-3.5-turbo-0125, on 2026-10-23. This uses the team's standard
    # judge instead (the CORE-547 setups' and the legacy engine's default),
    # greedy with thinking off, with the reference's 32-token judge budget and
    # its weights pinned to a Hugging Face commit. Verdicts are therefore not
    # comparable with the paper's.
    model: vllm/google/gemma-4-12B-it
    config:
      temperature: 0
      max_tokens: 32
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    # vllm serve arguments: the pinned weights and tokenizer.
    args:
      revision: 43c9d014b231474fa7212dbb48a762566c2b255d
      tokenizer_revision: 43c9d014b231474fa7212dbb48a762566c2b255d
