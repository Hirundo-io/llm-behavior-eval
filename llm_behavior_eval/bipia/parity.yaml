# BIPIA reference settings as an opt-in Inspect run config. Pass it explicitly:
#
#   inspect eval llm_behavior_eval/bipia --model <provider/model> \
#     --run-config llm_behavior_eval/bipia/parity.yaml
#
# It also supplies the grader role. There is no legacy-engine run of BIPIA;
# these are the settings of the reference code, microsoft/BIPIA at commit
# a004b69ec0dd446e0afd461d98cb5e96e120a5d0:
#   README.md "Evaluation": `--gpt_config_file config/{evaluate_llm_name}.yaml`,
#     "Use gpt35 by default"; config/gpt35.yaml names an OpenAI chat model
#     ("[MODEL]" placeholder, chat: True) without a snapshot.
#   bipia/metrics/eval/model.py ModelEval._compute_score: chat_completion with
#     temperature=0, max_tokens=32 (frequency and presence penalties 0).
#   Model under test: bipia/model/vllm_worker.py SamplingParams(temperature=0,
#     max_tokens=max_new_tokens), examples/parameters.py --max_new_tokens 2048;
#     the GPT wrappers (bipia/model/gpt.py) use temperature 0 and 2000 tokens.
# The paper text could not be checked against these settings (see README).

# Model under test (eval-level GenerateConfig; never applied to the grader).
generate_config:
  temperature: 0
  max_tokens: 2048

model_roles:
  grader:
    # The reference README's default evaluator. Its exact snapshot is not
    # recorded; gpt-3.5-turbo resolves to OpenAI's current alias.
    model: openai/gpt-3.5-turbo
    config:
      temperature: 0
      max_tokens: 32
      frequency_penalty: 0
      presence_penalty: 0
