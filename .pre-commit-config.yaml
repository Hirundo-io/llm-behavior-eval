repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.9.4
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --show-fixes]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.6
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: >-
          bash -c 'if [ "$(uname)" = "Darwin" ]; then .venv/bin/pyrefly check
          --replace-imports-with-any vllm
          --replace-imports-with-any vllm.model_executor.layers.quantization
          --replace-imports-with-any vllm.config
          --replace-imports-with-any vllm.lora.request
          --replace-imports-with-any vllm.distributed;
          else .venv/bin/pyrefly check; fi'
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        args: [-q]
        language: system
        types: [python]
        pass_filenames: true
        stages: [push]
