[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
llm-behavior-eval = "llm_behavior_eval.evaluate:app"

[project]
name = "llm-behavior-eval"
version = "0.1.12"
description = "Evaluate large-language models for undesirable behaviors such as bias."
authors = [{ name = "Hirundo", email = "dev@hirundo.io" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
keywords = [
  "dataset",
  "machine learning",
  "data science",
  "data engineering",
  "large language models",
  "LLMs evaluation",
  "bias evaluation",
  "bias in LLMs",
]
requires-python = ">=3.10.12,<3.14"
# Please only install Python >=3.10.12 or >=3.11.4 or >=3.12 to avoid GHSA-4xh5-x5gv-qwph vulnerability
# Upper bounds stop at the next release line that may break the APIs used here: the next
# major version, or the next minor for a 0.x package. Lines with a narrower bound say why.
dependencies = [
  # Native Inspect benchmarks (Python 3.11+): the shared code, then one line per merged
  # benchmark distribution (or group distribution), so installing llm-behavior-eval
  # installs every merged benchmark. Workspace distributions share one version; the
  # Inspect range lives in llm-behavior-eval-common.
  "llm-behavior-eval-common>=0.1.12,<0.2; python_version >= '3.11'",
  # Every published security benchmark (packages/security/README.md).
  "llm-behavior-eval-security>=0.1.12,<0.2; python_version >= '3.11'",
  "datasets>=5.0.1,<6.0.0",
  "numpy<3.0.0",
  "pandas<3.0.0",
  "pydantic<3.0.0",
  "pydantic_settings<3.0.0",
  "tqdm",
  "torch<3.0.0",
  # Gemma 4 uses guarded per-layer configs; keep the tested vLLM/Transformers pair.
  "transformers>=5.20.2,<5.21",
  "networkx<4.0.0",
  # Typer 0.27 bundles Click; older Typer loses argument help with Click 8.5.
  "typer>=0.27.3,<0.28",
  "accelerate<2.0.0",
  "bitsandbytes<1.0.0; platform_system != \"Darwin\"",
  "protobuf<7.0.0",                                    # needed for Mistral models
  "sentencepiece<1.0.0",                               # needed for Mistral models
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.0.0"]
# vLLM publishes Linux wheels only. Torch pins Triton and the CUDA runtime together.
vllm = [
  "vllm>=0.30.0,<0.31; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
gcs = ["google-cloud-storage"]
azure = ["azure-storage-blob","azure-identity"]
gpt-oss = ["opencv-python-headless>=4.12.0.88"]

[dependency-groups]
dev = [
  "ruff>=0.11.11,<1.0.0",
  "bumpver>=2024.1130",
  "pytest>=8.3.5",
  "pyyaml>=6.0.2",
  "pre-commit>=4.3.0",
  "llm-behavior-eval[mlflow,vllm,gcs,azure]",
  # Every workspace distribution, installed editable in the dev environment.
  "llm-behavior-eval-common",
  "llm-behavior-eval-security",
  "llm-behavior-eval-tensor-trust",
  # 1.2 is the first release that resolves llm_behavior_eval across the workspace's
  # src directories (a regular package in src/ and namespace portions in packages/).
  "pyrefly>=1.2,<2",
  "types-PyYAML",
  "types-tqdm",
]
# Tools CI runs without installing the project (`uv run --only-group ci ...`); a
# default group, so the dev environment has them too.
ci = [
  "twine>=6.1,<7",
  "zizmor>=1.16,<2",
]

[tool.uv]
# Dependency cooldown: resolve only releases at least 7 days old.
exclude-newer = "7 days"
# (Not `{ include-group = ... }` in dev: bumpver's TOML parser rejects inline tables
# in arrays.)
default-groups = ["dev", "ci"]

[tool.uv.workspace]
# Every distribution in this repository; see "Packaging" in INSPECT_MIGRATION.md.
# A benchmark PR adds its directory here, to [tool.uv.sources], to the dev group,
# to [tool.pyrefly] search-path and (when merged into the default install) to
# [project] dependencies.
members = [
  "packages/common",
  "packages/security",
  "packages/security/tensor_trust",
]

[tool.uv.sources]
llm-behavior-eval = { workspace = true }
llm-behavior-eval-common = { workspace = true }
llm-behavior-eval-security = { workspace = true }
llm-behavior-eval-tensor-trust = { workspace = true }

[tool.setuptools.packages.find]
# The legacy engine and llm_behavior_eval/__init__.py; native benchmarks and their
# shared code are separate distributions under packages/.
where = ["src"]
include = ["llm_behavior_eval", "llm_behavior_eval.evaluation_utils*"]

[tool.bumpver]
current_version = "0.1.12"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
  '^version = "{version}"$',
  '^current_version = "{version}"$',
]
"src/llm_behavior_eval/__init__.py" = ['^__version__ = "{version}"$']
# Every workspace distribution shares this version.
"packages/**/pyproject.toml" = ['^version = "{version}"$']

[project.urls]
Homepage = "https://github.com/Hirundo-io/llm-behavior-eval"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "W",
  "C901",
  "I",
  "N",
  "UP",
  "S",
  "B",
  "A",
  "TID",
  "TC",
  "NPY",
]
ignore = ["C901", "N806"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
# Disable fix for unused imports possibly needed for export.
unfixable = ["F401"]

[tool.ruff.lint.isort]
# tests/inspect_helpers.py and the scripts/ modules, imported through pytest's pythonpath.
known-local-folder = [
  "inspect_helpers",
  "check_artifact_licenses",
  "check_installs",
  "run_package_tests",
  "sync_upstream_revisions",
  "workspace",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S"]
# Repository tools run fixed local commands (uv, inspect) with subprocess.
"scripts/*.py" = ["S603", "S607"]
"hirundo_notion_tools/test_*.py" = ["S"]

[tool.pyrefly]
min-severity = "warn"
project-excludes = ["**/build/**", "**/.venv/**"]
# Every distribution's src directory (one per workspace member), then tests/ and
# scripts/, which are on pytest's pythonpath (shared helpers and repository tools),
# then the repository root (hirundo_notion_tools).
search-path = [
  "src",
  "packages/common/src",
  "packages/security/tensor_trust/src",
  "tests",
  "scripts",
  ".",
]

[tool.pytest.ini_options]
# The default prepend mode puts the repository root first on sys.path for each
# test module. setuptools' source-tree llm_behavior_eval.egg-info then shadows
# the editable install's dist-info, which has the PEP 610 metadata that Inspect
# uses to namespace registry names. importlib mode leaves sys.path unchanged.
addopts = ["--import-mode=importlib"]
# Shared test helpers (tests/inspect_helpers.py) and repository tools (scripts/)
# import as top-level modules.
pythonpath = ["tests", "scripts"]
