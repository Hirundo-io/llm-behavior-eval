[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
llm-behavior-eval = "llm_behavior_eval.evaluate:app"

[project.entry-points.inspect_ai]
llm_behavior_eval = "llm_behavior_eval._registry"

[project]
name = "llm-behavior-eval"
version = "0.2.0"
description = "Evaluate large-language models for undesirable behaviors such as bias."
authors = [{ name = "Hirundo", email = "dev@hirundo.io" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
keywords = [
  "dataset",
  "machine learning",
  "data science",
  "data engineering",
  "large language models",
  "LLMs evaluation",
  "bias evaluation",
  "bias in LLMs",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "inspect-ai>=0.3.288,<0.3.289",
  "openai>=3.4,<4",
  "datasets>=5.0.1,<6.0.0",
  "typer>=0.27.3,<0.28",
]

[project.optional-dependencies]
brief = ["inspect-brief>=0.1.1,<0.2"]
mlflow = ["mlflow>=2.8.0"]
tokenizers = ["transformers>=5.20.2,<5.21", "sentencepiece<1.0.0", "protobuf<7.0.0"]
hf = ["llm-behavior-eval[tokenizers]", "torch<3.0.0", "accelerate<2.0.0"]
vllm = [
  "transformers>=5.20.2,<5.21",
  "vllm>=0.30.0,<0.31; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[dependency-groups]
dev = [
  "ruff>=0.11.11,<1.0.0",
  "bumpver>=2024.1130",
  "pytest>=8.3.5",
  "pyyaml>=6.0.2",
  "pre-commit>=4.3.0",
  "pyrefly>=0.63.1",
  "types-PyYAML",
  "types-tqdm",
]

[tool.uv.sources]
llm-behavior-eval = { path = ".", editable = true }

[tool.setuptools.package-data]
llm_behavior_eval = ["target_metrics.json"]

[tool.setuptools.packages.find]
include = ["llm_behavior_eval*"]
exclude = ["results*"]

[tool.bumpver]
current_version = "0.2.0"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
  '^version = "{version}"$',
  '^current_version = "{version}"$',
]
"llm_behavior_eval/__init__.py" = ['^__version__ = "{version}"$']

[project.urls]
Homepage = "https://github.com/Hirundo-io/llm-behavior-eval"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "W",
  "C901",
  "I",
  "N",
  "UP",
  "S",
  "B",
  "A",
  "TID",
  "TC",
  "NPY",
]
ignore = ["C901", "N806"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
# Disable fix for unused imports possibly needed for export.
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S"]
"hirundo_notion_tools/test_*.py" = ["S"]

[tool.pyrefly]
min-severity = "warn"
