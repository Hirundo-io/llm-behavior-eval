name: pyrefly
# Hardening (zizmor checks it in vulnerability-scan.yaml): every action is pinned to a
# full commit SHA, with its tag in the trailing comment, so a moved or compromised tag
# can't change what runs; Renovate proposes the updates.
on:
  - pull_request
  - merge_group

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # This is required for actions/checkout

jobs:
  pyrefly:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No token left in .git/config for later steps (or uploaded artifacts) to read.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --locked --extra mlflow --extra vllm
      # The locked pyrefly, as in the dev environment.
      - run: uv run --locked pyrefly check
      # AgentDyn conflicts with the dev group ([tool.uv] conflicts), so the check above
      # types its agentdojo imports as Any; check it again in its own environment, with
      # the dev group's locked pyrefly, pytest and YAML stubs.
      - name: Type-check AgentDyn in its own environment
        run: |
          uv export --locked --only-group dev --no-emit-project --no-hashes \
            --no-header --no-annotate \
            | grep -E '^(pyrefly|pytest|types-pyyaml)==' > "$RUNNER_TEMP/typecheck.txt"
          uv run --isolated --locked --package llm-behavior-eval-agentdyn \
            --with-requirements "$RUNNER_TEMP/typecheck.txt" \
            pyrefly check llm_behavior_eval/security/agentdyn tests/test_inspect_agentdyn.py
