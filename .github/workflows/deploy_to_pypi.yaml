name: Push new release of the package to PyPI
# Hardening (zizmor checks it in vulnerability-scan.yaml): every action is pinned to a
# full commit SHA, with its tag in the trailing comment, so a moved or compromised tag
# can't change what runs; Renovate proposes the updates.

on:
  pull_request:
    types: [closed]

jobs:
  push_to_pypi:
    name: Upload release to PyPI
    if: ${{ github.event.pull_request.merged == true && (contains(github.event.pull_request.labels.*.name, 'release') || contains(github.event.pull_request.labels.*.name, 'test')) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ contains(github.event.pull_request.labels.*.name, 'release') && 'pypi' || 'testpypi' }}
      url: ${{ contains(github.event.pull_request.labels.*.name, 'release') && 'https://pypi.org/p/llm-behavior-eval' || 'https://test.pypi.org/p/llm-behavior-eval' }}
    permissions:
      contents: write  # Used to push tag with release
      pull-requests: read  # Used to create and merge PR with release
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      # The job pushes the release tag with the checkout's credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Push tag with release
        # Pull-request fields (title, body) are attacker-editable: they reach the script
        # as environment variables, never as ${{ }} expressions inside `run`, so their
        # text can't inject shell commands.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TAG: ${{ github.event.pull_request.title }}
          MESSAGE: ${{ github.event.pull_request.body }}
        run: |
          git config user.name "GitHub Actions [release-bot]"
          git config user.email "github-actions@hirundo.io"
          git pull origin "${BASE_REF}"
          git tag -a "${TAG}" -m "${MESSAGE}"
          git push origin "${TAG}"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # No cache in a publishing job: a poisoned cache could reach the artifacts.
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: "pyproject.toml"

      # Every distribution: llm-behavior-eval, llm-behavior-eval-common and each
      # native benchmark (and group) distribution under llm_behavior_eval/. Each needs its own
      # PyPI project with this workflow as a trusted publisher.
      - name: Build every distribution
        run: uv build --all-packages --out-dir dist
      - name: Check distribution metadata and license files
        run: |
          uv run --locked --only-group ci twine check --strict dist/*
          python scripts/check_artifact_licenses.py dist
      - name: Publish package distributions to TestPyPI (ACT)
        env:
          GITHUB_WORKFLOW_REF: .github/workflows/deploy_to_pypi.yaml
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: ${{ vars.ACT == 'true' }}
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_APIKEY }}
      - name: Publish package distributions to TestPyPI (Github Actions)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: ${{ contains(github.event.pull_request.labels.*.name, 'test') }}
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
