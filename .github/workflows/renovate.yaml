name: Renovate
# Hardening (zizmor checks it in vulnerability-scan.yaml): every action is pinned to a
# full commit SHA, with its tag in the trailing comment, so a moved or compromised tag
# can't change what runs; Renovate proposes the updates.
# Self-hosted Renovate (.github/renovate.json): dependency, GitHub Actions and
# upstream benchmark revision updates (.github/upstream-revisions.env).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    # Manual runs only from the default branch, like scheduled ones: Renovate reads
    # its configuration (including the API endpoint it sends the write-scoped token
    # to) from the checked-out ref.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    # The Renovate GitHub App's private key lives only in this environment, which is
    # restricted to the default branch. It has no required reviewer, so the weekly
    # run stays unattended; Renovate's pull requests still pass the usual human
    # review and merge gate.
    environment: renovate
    # The job's own token stays read-only: Renovate writes with the App token below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No token left in .git/config for later steps (or uploaded artifacts) to read.
          persist-credentials: false
      # A short-lived installation token of the Renovate GitHub App, limited to this
      # repository. Unlike GITHUB_TOKEN, its pushes and pull requests start CI, and it
      # can hold the workflows permission that updating the pinned actions in
      # .github/workflows needs. It is revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # Renovate pushes its update branches
          permission-issues: write # Renovate keeps its dependency dashboard issue
          permission-pull-requests: write # Renovate opens and updates its pull requests
          permission-workflows: write # Renovate updates pinned actions in workflow files
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ steps.app-token.outputs.token }}
          renovate-image: renovate/renovate:44.181.11@sha256:050ecf98a30c64b5dd4c51343218d52dcb6cce6875cc47cb5a754f7adee65af7
