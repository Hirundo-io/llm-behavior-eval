name: unit-tests
# Hardening (zizmor checks it in vulnerability-scan.yaml): every action is pinned to a
# full commit SHA, with its tag in the trailing comment, so a moved or compromised tag
# can't change what runs; Renovate proposes the updates.
on:
  - pull_request
  - merge_group

permissions:
  contents: read

jobs:
  pytest:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No token left in .git/config for later steps (or uploaded artifacts) to read.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install the project
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -v

  native-packages:
    # Each native distribution's tests in an environment holding only it and its
    # declared dependencies (no legacy engine, no other benchmark).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No token left in .git/config for later steps (or uploaded artifacts) to read.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: "pyproject.toml"
      - name: Run each distribution's tests in its own environment
        run: python scripts/run_package_tests.py -- -v

  distributions:
    # Build every distribution, check its metadata and license files, and check
    # Inspect's task names with wheels, without the legacy distribution, and editable.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No token left in .git/config for later steps (or uploaded artifacts) to read.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: "pyproject.toml"
      - name: Build every distribution
        run: uv build --all-packages --out-dir dist
      - name: Check distribution metadata
        run: uv run --locked --only-group ci twine check --strict dist/*
      - name: Check license metadata and files
        run: python scripts/check_artifact_licenses.py dist
      - name: Check installs and Inspect task names
        run: python scripts/check_installs.py
      - name: Check installs and Inspect task names in the security group
        run: python scripts/check_installs.py --group security
