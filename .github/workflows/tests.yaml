name: unit-tests
on:
  - pull_request
  - merge_group

permissions:
  contents: read

jobs:
  pytest:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the project
        run: uv sync --locked
      - name: Run tests
        run: uv run --no-sync pytest --import-mode=importlib -v

  native-smoke:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Retain the locked comparison environment until LLM-171 removes legacy dependencies.
      - run: uv sync --locked --extra brief
      - name: Registered native tasks and brief (CPU, local fixtures)
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: uv run --no-sync pytest --import-mode=importlib -v tests/test_inspect_smoke.py tests/test_inspect_brief.py tests/test_preset_inspect_mapping.py
