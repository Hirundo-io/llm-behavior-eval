name: unit-tests
on:
  - pull_request
  - merge_group

permissions:
  contents: read

jobs:
  pytest:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Reporting extras plus the dev group (hf and vllm extras), so provider and
      # tokenizer tests run.
      - name: Install the project
        run: uv sync --locked --extra brief --extra mlflow
      # pyproject.toml sets --import-mode=importlib for every pytest run.
      - name: Run tests
        run: uv run --no-sync pytest -v

  native-smoke:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra brief --extra mlflow
      - name: List registered tasks through the entry point
        working-directory: ${{ runner.temp }}
        run: uv run --no-sync --project "$GITHUB_WORKSPACE" inspect list tasks llm_behavior_eval
      - name: Registered tasks, inspect-brief, presets and MLflow (CPU, offline)
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: >-
          uv run --no-sync pytest -v
          tests/test_inspect_smoke.py
          tests/test_inspect_brief.py
          tests/test_preset_inspect_mapping.py
          tests/test_inspect_mlflow.py
