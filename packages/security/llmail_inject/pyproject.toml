[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-behavior-eval-llmail-inject"
version = "0.1.12"
description = "LLMail-Inject indirect prompt-injection attacks on an email assistant, as native Inspect tasks."
readme = "src/llm_behavior_eval/security/llmail_inject/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hirundo", email = "dev@hirundo.io" }]
requires-python = ">=3.11,<3.14"
# Upper bounds stop at the next release line that may break the APIs used here: the next
# major version, or the next minor for a 0.x package. Lines with a narrower bound say why.
dependencies = [
  # The shared code and Inspect (inspect-ai>=0.3.289,<0.4). Never the llm-behavior-eval
  # distribution: it carries the legacy engine (torch, transformers).
  "llm-behavior-eval-common>=0.1.12,<0.2",
  # The challenge truncates attacker emails to 6,000 gpt-4o (o200k_base) tokens; 0.7 is
  # the first release with that encoding.
  "tiktoken>=0.7,<0.13",
]

[project.optional-dependencies]
# Levels 3 and 4 rank the benign emails by TF-IDF similarity to the query.
tfidf = ["scikit-learn>=1.5,<2"]

[project.urls]
Homepage = "https://github.com/Hirundo-io/llm-behavior-eval"

[project.entry-points.inspect_ai]
# Inspect loads only the entry points named after a task's package prefix, so every
# benchmark distribution uses the name llm_behavior_eval and its own task module.
llm_behavior_eval = "llm_behavior_eval.security.llmail_inject.task"

[tool.setuptools.packages.find]
# A portion of the shared llm_behavior_eval namespace: no __init__.py above the benchmark.
# Listing the namespaces keeps the layout "simple" for setuptools, so an editable install
# puts src/ on sys.path.
where = ["src"]
include = [
  "llm_behavior_eval",
  "llm_behavior_eval.security",
  "llm_behavior_eval.security.llmail_inject*",
]
namespaces = true

[tool.setuptools.package-data]
"*" = ["README.md", "parity.yaml", "target_metrics.json"]
